    try {

        return url.origin + parts.join("/") + "/";
    } catch(e) {
        return "";

}

function isInstalled(app) {
    const appName = (app.name || "").trim().toLowerCase();
    
    // 1. Extract base name from the entry path
    const baseName = (app.entry || "")
        .split("/")
        .pop()
        .split(".")[0]
        .toLowerCase();

    // 2. Map app types to their proper extensions


    // Fallback to the entry path's own extension, defaulting to .js if none exists


    const ext = '.' + app.type
    const fileName = baseName + ext;

    // 3. Check File System directly (Independent of getApps)
    const fs = parent.getFs() || [];
    const fileExists = fs.some(f => (f.name || "").toLowerCase() === fileName);
    const fsNames = new Set(fs.map(f => (f.name || "").toLowerCase()));

    if (fileExists || fsNames.has(appName) || fsNames.has(baseName)) {
        return true;
    }

    // 4. Check registered apps list
    return (parent.getApps() || []).some(a => {
        if (a.system) return false;
        
        const name = (a.name || "").trim().toLowerCase();
        const path = (a.path || "").toLowerCase();
        
        return (
            name === appName ||
            (path && path.includes(appName)) ||
            (path && !baseName.includes("index") && path.includes(baseName))
        );
    });
}

async function connect() {
    const metaInput = document.getElementById("meta");
    const status = document.getElementById("status");
    const meta = metaInput.value.trim();
    const repo = getRepoUrl(meta);
    
    if (!repo || !meta) {
        status.innerText = currentStrings.fillFields;
        return;
    }
    
    try {
        BASE_URL = repo;
        META_URL = meta;
        status.innerText = currentStrings.connectedSuccess;
        const note = await start();
        status.innerText = note;
        localStorage.setItem("StoreRepo", meta);
    } catch (e) {
        status.innerText = currentStrings.connectFailed;
        parent.console.error(e.message);
    }
}

const start = async () => {
    let ret;
    applyDOMTranslations();
    
    if (!navigator.onLine){
        showNoInternetUI();
        return "Offline";
    }
    try {
        const response = await fetch(META_URL);
        
        if (!response.ok) {
            if (response.status === 429 || response.status === 509) { // Трафік / Ліміти
                showTrafficLimitUI();
                return "Limit reached";
            }
            throw new Error("HTTP " + response.status);
        }
        
        apps = await response.json();
        
        if (!Array.isArray(apps)) {
            ret = "Invalid meta format";
            return parent.console.error(ret);

        }
        if (response.ok){
        update();
        ret = "Found: " + apps.length;
        err.style.display = "none";
        }


        
    } catch (e) {
        console.error("Store load failed:", e);
        ret = "Store load failed:" + e;
        showTrafficLimitUI(); // Повертаємо вікно кастомного репо у разі падіння хоста
    }
    parent.console.log("[Infinity Store] "+ ret);
    return ret;
}

function formatVersion(rawDate) {
    const day = rawDate.slice(0, 2);
    const month = rawDate.slice(2, 4);
    const year = rawDate.slice(4, 8);
    return `${year}${month}${day}`;
}

function getMinRam(app) {
    if (!app?.tester) return 0; // Захист від undefined
    for (const str of app.tester.split(' ')) {
        if (str.includes('GB')) {
            return parseInt(str); 
        }
    }
    
    return 0;
}

function isCompatible(app) {
    return (formatVersion(currentOS) >= formatVersion(app.minOS) ) && (currentRam >= getMinRam(app));
}

function computeRating(app) {
    const t = (app.tester || "").toLowerCase();
    let score = 3.0;
    allApps = apps; 

    // --- Positive signals ---
    if (t.includes("stable"))                               score += 1.5;
    if (t.includes("runs on all devices") ||
        t.includes("runs on most"))                         score += 0.5;
    if (t.includes("low resource"))                         score += 0.5;
    if (t.includes("low resource"))                         score += 0.5;
    if (t.includes("applying successfully"))                score += 0.5;
    if (t.includes("doesnt use storage"))                   score += 0.5;
    if (t.includes("can be set as"))                        score += 1.0;

    // --- Negative signals ---
    if (t.includes("not playable"))                         score -= 2.0;
    if (t.includes("unstable"))                             score -= 1.0;
    if (t.includes("lags") || t.includes("lag"))            score -= 0.75;
    if (t.includes("4gb ram"))                              score -= 1.5;
    if (t.includes("2gb ram"))                              score -= 0.75;
    if (t.includes("requires newer gpu") ||
        t.includes("may require newer gpu"))                score -= 0.5;
    if (t.includes("gpu recommended"))                      score -= 0.25;
    if (t.includes("needs internet") ||
        t.includes("requires high network"))                score -= 0.5;
    if (t.includes("unsupported on mobile"))                score -= 0.5;
    if (t.includes("sometimes") || t.includes("may lag"))   score -= 0.5;
    if (t.includes("large files may lag"))                  score -= 0.25;
    if (t.includes("telemetry"))                         score -= 4.0; // Even if i was deleted, but original dev implemented it.

     const allVersions = allApps.map(a => parseInt(formatVersion(a.minOS || "99999999"), 10));
    const minVer = Math.min(...allVersions);
    const maxVer = Math.max(...allVersions);
    const appVer = parseInt(formatVersion(app.minOS || "99999999"), 10);
    const userVer = parseInt(formatVersion(currentOS), 10);

    // Bonus up to +0.5 based on where this app sits in the [min, max] spread
    if (maxVer > minVer) {
        const normalized = 1 - (appVer - minVer) / (maxVer - minVer); // 1 = oldest req, 0 = newest req
        score += normalized * 0.5;
    }

    // Extra +0.25 if the app's required OS is older than the user's current OS
    // (meaning it's comfortably within the user's compatibility range)
    if (appVer <= userVer) score += 0.25;

apps.find(a => a.name == app.name && a.desc == app.desc).rating = Math.min(5, Math.max(1, Math.round(score * 2) / 2));
    return Math.min(5, Math.max(1, Math.round(score * 2) / 2));
}
async function uninstall(app) {
    const entryName = (app.entry || "")
        .split("/")
        .pop()
        .split(".")[0] // Strip extensions cleanly
        .toLowerCase();

    const appName = (app.name || "").trim().toLowerCase();

    // 1. Process HTML type via registered app API
    if (app.type === 'html') {
        const appInstance = parent.getApps().find(a => {
            if (a.system) return false;
            const name = (a.name || "").trim().toLowerCase();
            const path = (a.path || "").toLowerCase();

            return (
                name === appName ||
                (path && path.includes(appName)) ||
                (path && entryName !== "index" && path.includes(entryName))
            );
        });

        if (appInstance) {
            await parent.deleteApp(appInstance);
        }
    } 
    // 2. Process all non-HTML types strictly in the file system
    else {
        // Build the dynamic file name directly using app.type as requested
        const ext = app.type ? `.${app.type.toLowerCase()}` : '.js';
        const targetFileName = entryName + ext;

        const f = parent.getFs().find(file => {
            const currentFileName = (file.name || "").toLowerCase();
            return (
                currentFileName === targetFileName ||
                currentFileName.includes(appName) ||
                currentFileName.includes(entryName)
            );
        });

        if (f) {
            await parent.deleteFile(f.name);
        }
    }

    // 3. Fire the success notification & refresh the store UI anyway
    new parent.Notification("Infinity Store", {
        body: (currentStrings.alertSuccessRemove) + app.name,
        icon: parent.getIcns().store
    });

    renderApps(apps);
}

function renderStars(rating, showNumber = 1) {
    let html = '<span style="font-size:15px;letter-spacing:1px;line-height:1;">';
    for (let i = 1; i <= 5; i++) {
        const color = rating >= i ? '#EF9F27'
                    : rating >= i - 0.5 ? '#EF9F27'
                    : 'var(--color-text-tertiary, #aaa)';
        const opacity = rating >= i ? '1'
                      : rating >= i - 0.5 ? '0.5'
                      : '0.25';
        html += `<span style="color:${color};opacity:${opacity};">★</span>`;
    }
    if (showNumber)
        html += ` <small>${rating.toFixed(1)}</small>`;
    html += '</span>';
    return html;
}

/* Cards */
function createCard(app) {
    const card = document.createElement("div");
    card.className = "app-card";

    const installed = isInstalled(app);
    apps.find(a => a.name == app.name && a.desc == app.desc).installed = installed;
    const compatible = isCompatible(app);

    card.innerHTML = `
        <p style="white-space: nowrap; font-weight: bold; font-size: 20px;">
            ${app.name || ""}
        </p>

        <small style="display:flex; justify-content:space-between;">
            ${app.developer || ""} ${renderStars(computeRating(app), 0)}
        </small>

        <br>

        <button class="inst">${currentStrings.install}</button>
        <button class="uninst">${currentStrings.uninstall}</button>
    `;

    const instBtn = card.querySelector(".inst");
    const uninstBtn = card.querySelector(".uninst");

    if (!compatible) instBtn.disabled = true;

    instBtn.style.display = installed ? "none" : "";
    uninstBtn.style.display = installed ? "" : "none";

    card.onclick = () => openDialog(app);

    instBtn.onclick = (e) => {
        e.stopPropagation();
        install(app.name);
    };

uninstBtn.onclick = async (e) => {
    e.stopPropagation();

    uninstall(app)
}

    return card;
}

function renderApps(list) {
    appsContainer.innerHTML = "";
    try {
        list.forEach(app => appsContainer.appendChild(createCard(app)));
    } catch(e) {parent.console.error(e.message)}
}

function renderDevAppsRow(app) {
    if (!app.developer) return "";

    const others = apps.filter(a =>
        a.developer === app.developer);

    if (!others.length == 1) return "";

    return `
        <hr>
        <p><b>${currentStrings.moreFromDev}</b></p>
        <div class="dev-apps-row" id="dev-apps-row"></div>
    `;
}

function populateDevAppsRow(app) {
    const row = document.getElementById("dev-apps-row");
    if (!row) return;

    const others = apps.filter(a =>
        a.developer === app.developer
    );
    

    row.innerHTML = "";
    others.forEach(other => {
        const mini = document.createElement("div");
        mini.className = "dev-app-mini";

        const hasBanner = other.banner && other.banner.trim() !== "";
        const src = hasBanner
            ? (other.banner.includes("://") ? other.banner : BASE_URL + other.banner)
            : "";

        mini.innerHTML = hasBanner
            ? `<img class="mini-thumb" src="${src}" alt="">`
            : `<div class="mini-thumb placeholder">${(other.name || "?").charAt(0).toUpperCase()}</div>`;

        mini.innerHTML += `<small>${other.name || ""}</small>`;

        mini.onclick = (e) => {
            e.stopPropagation();
            openDialog(other);
        };

        row.appendChild(mini);
    });
}

function renderCarousel(list) {
    slidesWrapper.innerHTML = "";

    list.forEach(app => {
        const slide = document.createElement("div");
        slide.className = "mySlides";

        const src = app.banner.includes("://")
            ? app.banner
            : BASE_URL + app.banner;

        slide.innerHTML = `
            <img class="bg" src="${src}" alt="">
            <img class="fg" alt="${app.name || ""}" src="${src}">
        `;

        slide.onclick = () => openDialog(app);
        slidesWrapper.appendChild(slide);
    });

    slideIndex = 1;
    showSlides(slideIndex);
}
/* Dialog */
function openDialog(app) {
    dialog.style.display = "flex";

    const installed = isInstalled(app);
    const compatible = isCompatible(app);
    const minRam = getMinRam(app);

    // 1. Починаємо збирати рядок шаблону
    let html = `
        <h2 style="user-select: text;">${app.name || ""}</h2>
        <small>${app.developer || ""}</small>
        <br>
        <button class="inst">${currentStrings.install}</button>
        <button class="uninst">${currentStrings.uninstall}</button>

        <p style="user-select: text;">${app.desc || ""}</p>
        <p><b>${currentStrings.minOS}:</b> ${app.minOS || "00000000"}</p>
    `;

    // 2. Додаємо RAM та депи прямо в рядок
    if (app.tester && app.tester.includes('GB') && minRam > 0) {
        html += `<p><b>${currentStrings.minRam}:</b> ${minRam}GB</p>`;
    }
    
    if (app.deps && app.deps.length > 0) {
        html += `<p><b>${currentStrings.deps}:</b> ${app.deps.join(", ")}</p>`;
    }

   // 3. Додаємо підвал картки
    html += `
        <hr>
        <p>${renderStars(computeRating(app))}</p>
        <p>${app.tester || ""}</p>
    `;

    html += renderDevAppsRow(app); // NEW

    // 4. ОДИН РАЗ оновлюємо DOM
    dialogContent.innerHTML = html;



    populateDevAppsRow(app); // NEW

    // 5. Тепер, коли DOM стабільний, шукаємо ТІ САМІ КНОПКИ, що бачить користувач
    const instBtn = dialogContent.querySelector(".inst");
    const uninstBtn = dialogContent.querySelector(".uninst");

    if (!compatible) instBtn.disabled = true;

    // Керування видимістю тепер відпрацює як годинник
    instBtn.style.display = installed ? "none" : "";
    uninstBtn.style.display = installed ? "" : "none";

    // Надійно вішаємо кліки на живі елементи
    instBtn.onclick = (e) => {
        e.stopPropagation();
        install(app.name);
    };

    uninstBtn.onclick = async (e) => {
        e.stopPropagation();
        uninstall(app);
    };

    dialog.onclick = (e) => {
        if (e.target === dialog) dialog.style.display = "none";
    };
}

};

/* Type filter tabs (moved out of the toolbar dropdown into the sidebar) */
function setupTypeTabs() {
    const tabs = document.querySelectorAll(".type-tab");
    tabs.forEach(tab => {
        tab.onclick = () => {
            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentMode = tab.dataset.type;
            update();
        };

}
setupTypeTabs();

/* Filters */
const searchInput = document.getElementById("search-input");

function filterApps() {
    const mode = currentMode;
    const query = searchInput.value.toLowerCase();
    let a;
    try {
         a = apps.filter(app =>
            (mode === "all" || app.type === mode) &&
            app.name.toLowerCase().includes(query)
        );
    } catch(e) {
        a = apps;
    }
    return a;
}

async function install(name) {
    const app = apps.find(a => a.name === name);
    if (!app) {
        parent.console.error("App not found in registry: " + name);
        return 0;
    }

    const url = BASE_URL + app.entry;
    parent.console.log("Downloading from: " + url);

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP error " + res.status);

        const blob = await res.blob();
        if (!blob) throw new Error("No BLOB provided.");

        const file = new File([blob], `tmp_${Date.now()}.zip`, {
            type: blob.type || "application/zip"
        });

        await parent.unzipFile(file, "");

        if (app.deps && app.deps.length > 0) {
            await parent.npmUpdate();
            for (const pkg of app.deps) {
                await parent.npmInstall(pkg);
            }
        }

        if (app.type === "js") {
            const fileName = app.entry.split("/").pop().split(".")[0].toLowerCase() + '.js';
            const fileExists = parent.getFs().find(f => f.name.toLowerCase() == fileName);
            console.warn("JS got from entry: "+ fileName + fileExists)
            if (fileExists) {
                let autoload = [];
                const autoloadString = localStorage.getItem('autoload') || "[]";
                
                if (autoloadString) {
                    try {
                        autoload = JSON.parse(autoloadString);
                    } catch (e) {
                        console.error("Autoload parse error:", e.message);
                        autoload = [];
                    }
                }
                console.log(autoload)

                if (!autoload.includes(fileName)) {
                    autoload.push(fileExists.name);
                    localStorage.setItem('autoload', JSON.stringify(autoload));
                }
            }
        }else if (app.type === "wasm") {
            const fileName = app.entry.split("/").pop().split(".")[0].toLowerCase() + '.wasm';
            const fileExists = parent.getFs().find(f => f.name.toLowerCase() == fileName);
            console.warn("WASM got from entry: "+ fileName + fileExists)
            if (fileExists) {
                let autoload = [];
                const autoloadString = localStorage.getItem('autoload') || "[]";
                
                if (autoloadString) {
                    try {
                        autoload = JSON.parse(autoloadString);
                    } catch (e) {
                        console.error("Autoload parse error:", e.message);
                        autoload = [];
                    }
                }
                console.log(autoload)

                if (!autoload.includes(fileName)) {
                    autoload.push(fileExists.name);
                    localStorage.setItem('autoload', JSON.stringify(autoload));
                }
            }
        }else if (app.type == "html"){
            await parent.registerApps()
            renderApps(apps)
        }

       new parent.Notification("Infinity Store",{body:currentStrings.alertSuccess + app.name, icon: parent.getIcns().store});
       
        return 1;

    } catch (e) {
        parent.console.error(`Installation failed for ${name}: ${e.message}`);
        return 0;
    }
}

function update() {
    const filtered = filterApps();
    renderApps(filtered);
    try {
        renderCarousel(filtered.filter(a => a.banner != ""));
    } catch(e) {}
}

searchInput.oninput = update;

/* Slideshow */
let slideIndex = 1;

function plusSlides(n) {
    showSlides(slideIndex += n);
}

function showSlides(n) {
    const slides = document.getElementsByClassName("mySlides");
    if (!slides.length) return;
    
    if (n > slides.length) slideIndex = 1;
    if (n < 1) slideIndex = slides.length;

    for (let s of slides) {
        s.style.display = "none";
    }
    slides[slideIndex - 1].style.display = "block";
}

setInterval(() => plusSlides(1), 4000);

window.onerror = (e) => {
    parent.console.error(e.message);
}

}
