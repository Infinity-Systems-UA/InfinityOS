<style>
  * { user-select: none; box-sizing: border-box; }
  
  html, body {
    overflow-x: hidden;
  }

  .charts-container {
    display: flex;
    gap: 15px;
    width: 98.5%;
    margin-bottom: 45px;
    padding-bottom: 30px;
    position: relative;
    clear: both;
  }

  .chart-box {
    flex: 1;
    min-width: 0;
    height: 200px;
  }

  canvas {
    box-sizing: border-box; 
    width: 100% !important;
    height: 100% !important;
  }

  button { 
    padding: 2px 8px; border: 1px solid #aaa; background-color: #ddd; 
    cursor: pointer; font-weight: bold; 
  }

  .process-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 10px;
    margin-top: 10px;
  }

  .process-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 4px;
    padding: 5px 5px;
    border-bottom: 1px solid #eee;
    min-width: 0;
  }

  .process-info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }

  .process-title {
    font-size: 0.95em;
    font-weight: 500;
    word-break: break-all;
  }

  .process-id {
    color: #bbb;
    font-size: 0.75em;
    display: block;
    margin-top: 2px;
  }

  .kill-btn:hover {
    background-color: #ff4d4d;
    color: white;
    border-color: #ff3333;
  }

  p, h2 {
    padding-left: 10px;
  }
</style>

<link rel="stylesheet" href="global.css">

<div class="charts-container">
  <div class="chart-box">
    <h2 id='cpu_title'>CPU:</h2>
    <canvas id="line-chart"></canvas>
  </div>
  
  <div class="chart-box">
    <h2 id='ram_title'>RAM:</h2>
    <canvas id="ram-chart"></canvas>
  </div>
</div>

<h2 id='processes_title'>Processes:</h2>
<div id="process-list" class="process-list"></div>

<script src="../dist/chart.umd.js"></script>

<script>
window.Worker = parent.Worker;

// --- Локалізація ---
const parentLang = window.parent._ || (s => s);
document.getElementById('ram_title').innerText = parentLang("ram") + " (MB):";
document.getElementById('cpu_title').innerText = parentLang("cpu") + ":";
document.getElementById('processes_title').innerText = parentLang("processes") + ":";

// Фіксована довжина історій графіків
const HISTORY_LIMIT = 50;

// --- ГРАФІК ОЗП (RAM) ---
const ramData = new Array(HISTORY_LIMIT).fill(0);
const limitData = new Array(HISTORY_LIMIT).fill(0);
const mem = (navigator.deviceMemory || 4) * 1024;

const ramChart = new Chart(document.getElementById("ram-chart"), {
  type: "line",
  data: {
    labels: Array(HISTORY_LIMIT).fill(""),
    datasets: [
      { 
        data: ramData, 
        borderColor: "#d4af37", 
        fill: true, 
        backgroundColor: "rgba(212, 175, 55, 0.1)",
        tension: 0.4,
        pointRadius: 0 
      },
      {
        data: limitData,
        borderColor: "#ff4d4d",
        borderDash: [5, 5],
        borderWidth: 2,
        fill: false,
        pointRadius: 0,
        order: 1
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    layout: { padding: 0 },
    scales: {
      x: { display: false },
      y: { beginAtZero: true, max: mem, grace: '5%' }
    },
    plugins: { legend: { display: false } }
  }
});

function updateRAM() {
  let memoryUsage = 0;
  let heapLimit = 0;

  if (performance.memory) {
    memoryUsage = (performance.memory.usedJSHeapSize / 1048576);
    heapLimit = (performance.memory.jsHeapSizeLimit / 1048576);
  } else {
    const processCount = document.getElementsByClassName("winbox").length;
    memoryUsage = 10 + processCount * 2.5;
  }

  // Оновлюємо кільцевий буфер без перезапису масиву
  ramData.shift();
  ramData.push(memoryUsage);

  // Заповнюємо лінію ліміту без перевиділення пам'яті
  limitData.fill(heapLimit);

  ramChart.update('none');
}

setInterval(updateRAM, 1000);


// --- ГРАФІК CPU (Оптимізований Worker) ---
// Worker тепер вимірює навантаження за допомогою setTimeout замість жорсткого while(true)
const workerCode = `
  setInterval(() => {
    const start = performance.now();
    let iterations = 0;
    
    // Крутимо цикл РІВНО 10 мс (займає лише 10% CPU замість 100%)
    while (performance.now() - start < 10) {
      iterations++;
    }
    
    postMessage(iterations);
  }, 100);
`;

const blob = new Blob([workerCode], { type: "text/javascript" });
const blobUrl = window.URL.createObjectURL(blob);
const processWorker = new Worker(blobUrl);

const performanceData = new Array(HISTORY_LIMIT).fill(0);

const chart = new Chart(document.getElementById("line-chart"), {
  type: "line",
  data: {
    labels: Array(HISTORY_LIMIT).fill(""),
    datasets: [{ data: performanceData, borderColor: "#0f796b", fill: true, tension: 0.4, pointRadius: 0 }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    layout: { padding: 0 },
    scales: {
      x: { display: false },
      y: { beginAtZero: true }
    },
    plugins: { legend: { display: false } }
  }
});

processWorker.onmessage = (e) => {
  performanceData.shift();
  performanceData.push(e.data);
  chart.update('none'); // Вимкнено анімаційне навантаження
};


// --- МЕНЕДЖЕР ПРОЦЕСІВ (Fragment / DOM diffing) ---
const processContainer = document.getElementById('process-list');

function updateProcessList() {
  const processes = [];

  // 1. WinBox
  try {
    const winboxCollection = window.parent.document.getElementsByClassName("winbox");
    for (let i = 0; i < winboxCollection.length; i++) {
      const el = winboxCollection[i];
      const title = el.querySelector('.wb-title')?.innerText || el.winbox?.title || parentLang("unknown");
      processes.push({ id: el.id, title, type: 'winbox', isHidden: el.classList.contains("hide") });
    }
  } catch (e) {}

  // 2. Workers
  try {
    const workers = parent.getSysWorkers() || [];
    workers.forEach(w => {
      const id = w.url ? w.url.split('/').pop() : 'worker';
      processes.push({ id: w.id, title: id, type: 'worker', isHidden: false });
    });
  } catch (e) {}

  // 3. Observers
  try {
    const obsrvs = parent.getMutObsrvs() || [];
    obsrvs.forEach(w => {
      processes.push({ id: w.id, title: w.id, type: 'observer', isHidden: false });
    });
  } catch (e) {}

  // Побудова через DocumentFragment мінімізує Reflow
  const fragment = document.createDocumentFragment();

  processes.forEach(proc => {
    const item = document.createElement('div');
    item.className = 'process-item';
    const textColor = proc.isHidden ? "#777" : "#000";

    item.innerHTML = `
      <div class="process-info" onclick="parent.fore('${proc.id}', '${proc.type}');">
        <span class="process-title" style="color: ${textColor};">${proc.title}</span>
        <span class="process-id">${proc.id}</span>
      </div>
      <button class="kill-btn" onclick="parent.kill('${proc.id}', '${proc.type}'); updateProcessList();">
        ×
      </button>
    `;
    fragment.appendChild(item);
  });

  processContainer.innerHTML = '';
  processContainer.appendChild(fragment);
}

setInterval(updateProcessList, 1000); // Збільшено інтервал з 500мс до 1000мс для зменшення навантаження
updateProcessList();

// Очищення блобу та воркера при закритті
window.addEventListener('pagehide', () => {
  processWorker.terminate();
  window.URL.revokeObjectURL(blobUrl);
});
</script>
