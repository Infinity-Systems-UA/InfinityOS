<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 64 64"
   version="1.1"
   id="svg2"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs2">
    <linearGradient
       id="linearGradient5">
      <stop
         style="stop-color:#00ff00;stop-opacity:1;"
         offset="0"
         id="stop5" />
      <stop
         style="stop-color:#000000;stop-opacity:1;"
         offset="1"
         id="stop6" />
    </linearGradient>
    <linearGradient
       id="linearGradient3">
      <stop
         style="stop-color:#000000;stop-opacity:1;"
         offset="0"
         id="stop3" />
      <stop
         style="stop-color:#000000;stop-opacity:0;"
         offset="1"
         id="stop4" />
    </linearGradient>
    <linearGradient
       xlink:href="#linearGradient3"
       id="linearGradient4"
       x1="4"
       y1="32.5"
       x2="56"
       y2="32.5"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       xlink:href="#linearGradient5"
       id="linearGradient6"
       x1="4"
       y1="32.5"
       x2="56"
       y2="32.5"
       gradientUnits="userSpaceOnUse" />
  </defs>
  <!-- Background -->
  <rect
     x="5"
     y="5"
     width="55"
     height="55"
     rx="8"
     fill="#000"
     id="rect1" />
  <!-- Task line (grid-aligned) -->
  <polyline
     points="5,50 30,30 40,35 55,15"
     fill="none"
     stroke="#00ff00"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="polyline1"
     style="fill:url(#linearGradient4);fill-opacity:1;stroke:url(#linearGradient6)" />
  <!-- Border -->
  <rect
     x="5"
     y="5"
     width="55"
     height="55"
     rx="10"
     fill="none"
     stroke="#777"
     stroke-width="3"
     id="rect2" />
</svg>
